[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "threadsnap"
version = "0.1.0"
description = "ThreadSnap 多平台论坛链接快照提取后端"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.19.1",
  "cryptography==46.0.7",
  "curl-cffi==0.16.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "json-repair==0.62.0",
  "numpy==1.26.4",
  "openpyxl==3.1.5",
  "pillow==12.3.0",
  "aistudio-sdk==0.1.3",
  "paddlepaddle==3.3.1",
  "paddlenlp==3.0.0b4",
  "patchright==1.61.2",
  "playwright==1.61.0",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "scrapling[fetchers]==0.4.12",
  "scipy==1.17.1",
  "sqlalchemy==2.0.52",
  "tzdata==2026.3",
  "uvicorn[standard]==0.52.3",
]

[project.scripts]
threadsnap = "threadsnap.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.16.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
threadsnap = [
  "migrations/README",
  "migrations/*.py",
  "migrations/*.mako",
  "migrations/versions/*.py",
  "tencent_captcha/js/dist/*.js",
  "tencent_captcha/js/tdc-handler-ir-v2.json",
]

[tool.unittest]
start-directory = "tests"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
